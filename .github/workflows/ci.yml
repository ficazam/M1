name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      # Install deps (frozen on main, flexible on PRs)
      - name: Install (main)
        if: github.ref == 'refs/heads/main'
        run: bun install --frozen-lockfile
      - name: Install (PR)
        if: github.event_name == 'pull_request'
        run: bun install

      # Build the shared schemas package
      - name: Build shared package
        run: bun run -F @app/schemas build

      # Make sure only one zod version is installed
      - name: Zod single-version check
        run: bun run check:zod

      # ✅ Run unit tests ONLY for schemas + web (skip API)
      - name: Unit tests (schemas + web only)
        run: |
          turbo run test \
            --filter=@app/schemas \
            --filter=dashboard

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      # Point Next at the Playwright mock API (tests start it; no Nest/DB)
      API_URL: http://127.0.0.1:3011
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Install (main)
        if: github.ref == 'refs/heads/main'
        run: bun install --frozen-lockfile
      - name: Install (PR)
        if: github.event_name == 'pull_request'
        run: bun install

      - name: Build shared package
        run: bun run -F @app/schemas build

      - name: Build Next app
        run: bun run --cwd apps/dashboard build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Next server
        run: bun run --cwd apps/dashboard start &

      - name: Wait for server
        run: npx -y wait-on@7 http://localhost:3000

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
